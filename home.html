<!DOCTYPE html>
<html lang="ar">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>PLASSHER Platform</title>

<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

<style>

:root{
  --main:#4facfe;
  --secondary:#00c6ff;
  --dark:#111;
}

body{
  font-family:'Cairo', sans-serif;
  margin:0;
  background:linear-gradient(180deg, var(--main), var(--secondary));
  color:#333;
  padding-bottom:70px;
}

/* HERO */
header{
  text-align:center;
  padding:50px 20px 30px;
  color:white;
}

h1{
  font-size:24px;
  margin-bottom:10px;
}

.subtitle{
  font-size:13px;
  opacity:0.9;
  max-width:280px;
  margin:auto;
  line-height:1.6;
}

/* WELCOME ICON */
.welcome{
  font-size:30px;
  margin-bottom:10px;
  animation:float 2s infinite ease-in-out;
}

@keyframes float{
  0%{transform:translateY(0);}
  50%{transform:translateY(-5px);}
  100%{transform:translateY(0);}
}

/* BUTTONS */
.cta{
  margin-top:20px;
}

.cta a{
  display:inline-block;
  margin:5px;
  padding:10px 20px;
  border-radius:25px;
  font-size:13px;
  text-decoration:none;
  font-weight:bold;
  transition:0.3s;
}

.primary{
  background:white;
  color:#333;
}

.primary:hover{
  background:#222;
  color:white;
}

.secondary{
  background:transparent;
  border:1px solid white;
  color:white;
}

.secondary:hover{
  background:white;
  color:#333;
}

/* SECTION TITLE */
.section-title{
  text-align:center;
  color:white;
  font-size:14px;
  margin-top:10px;
  opacity:0.9;
}

/* MENU */
.menu{
  padding:15px;
}

/* CARD */
.card{
  background:white;
  margin:12px 0;
  padding:16px;
  border-radius:14px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  box-shadow:0 6px 15px rgba(0,0,0,0.15);
  transition:0.3s;
}

.card:hover{
  transform:translateY(-4px) scale(1.01);
}

/* LEFT */
.left{
  display:flex;
  align-items:center;
}

/* ICON */
.icon{
  font-size:20px;
  margin-right:12px;
}

/* TEXT */
.card h2{
  font-size:15px;
  margin:0;
}

.card p{
  font-size:12px;
  margin:3px 0 0;
  opacity:0.7;
}

/* COLORS */
.admin{
  background:#EFFF6B;
}

.finance{
  background:#FFD700;
}

/* ARROW */
.arrow{
  font-size:15px;
}

/* FOOTER FIXED */
footer{
  position:fixed;
  bottom:0;
  left:0;
  width:100%;
  background:rgba(0,0,0,0.9);
  color:#aaa;
  padding:6px;
  text-align:center;
  font-size:10px;
  border-top:1px solid #333;
}

footer p{
  margin:2px 0;
}

footer i{
  margin:0 3px;
}

</style>

</head>

<body>

<header>

<div class="welcome">✨</div>

<h1>PLASSHER Platform</h1>

<div class="subtitle">
Platform for Legal, Administrative and Social Sciences
</div>

<div class="cta">
<a href="#menu" class="primary">Start Learning</a>
<a href="#menu" class="secondary">Explore</a>
</div>

</header>

<div class="section-title">Choose your field 👇</div>

<div id="menu" class="menu">

<a href="admin.html" style="text-decoration:none;color:black;">
<div class="card admin">
<div class="left">
<div class="icon"><i class="fa-solid fa-scale-balanced"></i></div>
<div>
<h2>Administrative Pole</h2>
<p>Legal & administrative studies</p>
</div>
</div>
<div class="arrow"><i class="fa-solid fa-chevron-right"></i></div>
</div>
</a>

<a href="finance.html" style="text-decoration:none;color:black;">
<div class="card finance">
<div class="left">
<div class="icon"><i class="fa-solid fa-coins"></i></div>
<div>
<h2>Financial Pole</h2>
<p>Finance & economic systems</p>
</div>
</div>
<div class="arrow"><i class="fa-solid fa-chevron-right"></i></div>
</div>
</a>

</div>

<footer>

<p>© 2026 - Adam zighem</p>

<p>

</p>

<p>
<i class="fa-brands fa-facebook"></i>
<i class="fa-brands fa-whatsapp"></i>
<i class="fa-brands fa-github"></i>
</p>

</footer>

</body>
</html>
