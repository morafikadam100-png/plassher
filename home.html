<!DOCTYPE html>
<html lang="ar">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>PLASSHER Platform</title>

<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

<style>

:root{
  --main:#4facfe;
  --secondary:#00c6ff;
  --dark:#111;
}

body{
  font-family:'Cairo', sans-serif;
  margin:0;
  background:linear-gradient(180deg, var(--main), var(--secondary));
  color:#333;
}

/* HEADER */
header{
  padding:35px 15px 20px;
  text-align:center;
  color:white;
}

h1{
  font-size:20px;
  margin-bottom:8px;
}

.subtitle{
  font-size:12px;
  opacity:0.9;
  line-height:1.5;
  max-width:260px;
  margin:auto;
}

/* BUTTON */
.cta{
  margin-top:12px;
}

.cta a{
  display:inline-block;
  background:white;
  color:#333;
  padding:7px 16px;
  border-radius:18px;
  font-size:12px;
  text-decoration:none;
  transition:0.3s;
}

.cta a:hover{
  background:#222;
  color:white;
}

/* MENU */
.menu{
  padding:12px;
}

/* CARD */
.card{
  background:white;
  margin:10px 0;
  padding:14px;
  border-radius:12px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  box-shadow:0 5px 12px rgba(0,0,0,0.15);
  transition:0.25s;
}

.card:hover{
  transform:translateY(-3px);
}

/* LEFT SIDE */
.left{
  display:flex;
  align-items:center;
}

/* ICON */
.icon{
  font-size:18px;
  margin-right:10px;
}

/* TEXT */
.card h2{
  font-size:14px;
  margin:0;
}

.card p{
  font-size:11px;
  margin:2px 0 0;
  opacity:0.7;
}

/* COLORS */
.admin{
  background:#EFFF6B;
}

.finance{
  background:#FFD700;
}

/* ARROW */
.arrow{
  font-size:14px;
}

/* FOOTER */
footer{
  margin-top:15px;
  background:#111;
  color:#aaa;
  padding:12px 8px;
  text-align:center;
  font-size:11px;
}

footer i{
  margin:0 4px;
}

/* ANIMATION */
.card{
  animation:fadeUp 0.6s ease;
}

@keyframes fadeUp{
  from{
    opacity:0;
    transform:translateY(10px);
  }
  to{
    opacity:1;
    transform:translateY(0);
  }
}

</style>

</head>

<body>

<header>

<h1>PLASSHER Platform</h1>

<div class="subtitle">
Platform for Legal, Administrative and Social Sciences
</div>

<div class="cta">
<a href="#menu">Start Learning</a>
</div>

</header>

<div id="menu" class="menu">

<a href="admin.html" style="text-decoration:none;color:black;">
<div class="card admin">
<div class="left">
<div class="icon"><i class="fa-solid fa-scale-balanced"></i></div>
<div>
<h2>Administrative Pole</h2>
<p>Legal & administrative studies</p>
</div>
</div>
<div class="arrow"><i class="fa-solid fa-chevron-right"></i></div>
</div>
</a>

<a href="finance.html" style="text-decoration:none;color:black;">
<div class="card finance">
<div class="left">
<div class="icon"><i class="fa-solid fa-coins"></i></div>
<div>
<h2>Financial Pole</h2>
<p>Finance & economic systems</p>
</div>
</div>
<div class="arrow"><i class="fa-solid fa-chevron-right"></i></div>
</div>
</a>

</div>

<footer>

<p>© 2026 - Adam zighem</p>

<p>

</p>

<p>
<i class="fa-brands fa-facebook"></i>
<i class="fa-brands fa-whatsapp"></i>
<i class="fa-brands fa-github"></i>
</p>

</footer>

</body>
</html>
