<style>

:root{
  --main:#4facfe;
  --secondary:#00f2fe;
  --dark:#111;
  --light:#ffffff;
}

body{
  font-family:'Cairo', sans-serif;
  margin:0;
  background:linear-gradient(to right, var(--main), var(--secondary));
  text-align:center;
  color:#333;
}

/* HEADER */
header{
  padding:60px 20px 40px;
  color:white;
}

h1{
  margin:0;
  font-size:34px;
}

.subtitle{
  max-width:700px;
  margin:15px auto;
  font-size:15px;
  line-height:1.8;
  opacity:0.9;
}

/* HERO BUTTON */
.cta{
  margin-top:20px;
}

.cta a{
  background:white;
  color:#333;
  padding:10px 20px;
  border-radius:25px;
  font-weight:bold;
  text-decoration:none;
  transition:0.3s;
}

.cta a:hover{
  background:#222;
  color:white;
}

/* MENU */
.menu{
  margin-top:40px;
  padding:20px;
}

/* CARDS */
.card{
  background:white;
  width:320px;
  margin:20px auto;
  padding:25px;
  border-radius:16px;
  box-shadow:0 10px 25px rgba(0,0,0,0.2);
  cursor:pointer;
  transition:0.3s;
}

.card:hover{
  transform:translateY(-8px) scale(1.03);
}

.card h2{
  margin-bottom:10px;
}

.card p{
  opacity:0.7;
}

/* COLORS */
.card1{ background:#EFFF6B; }
.card2{ background:#FFD700; }

/* FOOTER */
footer{
  position: fixed;
  bottom: 0;
  left: 0;
  width: 100%;
  background:#111;
  color:#aaa;
  padding:10px;
  text-align:center;
  font-size:12px;
  border-top:1px solid #444;
}

footer i{
  margin:0 5px;
  cursor:pointer;
}

footer i:hover{
  color:white;
}

body{
  padding-bottom:70px;
}

</style>

</head>
