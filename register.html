<!DOCTYPE html>
<html>
<body>

<h2>Register</h2>

<input type="text" id="name" placeholder="First Name"><br><br>
<input type="text" id="lastname" placeholder="Last Name"><br><br>
<input type="text" id="class" placeholder="Class"><br><br>

<input type="email" id="email" placeholder="Email"><br><br>
<input type="password" id="password" placeholder="Password"><br><br>

<button onclick="register()">Register</button>

<!-- Firebase -->
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>

<script>
const firebaseConfig = {
  apiKey: "AIzaSyB6eRzkkPGGe6Km_e8OC6SoNI9vYE1KeuY",
  authDomain: "plassher-b7ad4.firebaseapp.com",
  projectId: "plassher-b7ad4"
};

firebase.initializeApp(firebaseConfig);

const db = firebase.firestore();

function register(){
  var name = document.getElementById("name").value;
  var lastname = document.getElementById("lastname").value;
  var userclass = document.getElementById("class").value;
  var email = document.getElementById("email").value;
  var password = document.getElementById("password").value;

  firebase.auth().createUserWithEmailAndPassword(email, password)
  .then(() => {

    // 📊 تخزين المعلومات
    db.collection("users").add({
      name: name,
      lastname: lastname,
      class: userclass,
      email: email
    });

    window.location.href = "login.html";

  })
  .catch((error) => {
    alert(error.message);
  });
}
</script>

</body>
</html>
